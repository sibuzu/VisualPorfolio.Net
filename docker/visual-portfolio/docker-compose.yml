services:
  visualportfolio-frontend:
    build:
      context: ../..
      dockerfile: docker/visual-portfolio/Dockerfile.frontend
    container_name: visualportfolio-frontend
    restart: unless-stopped
    networks:
      - sibuzu-net

  visualportfolio-backend:
    build:
      context: ../..
      dockerfile: docker/visual-portfolio/Dockerfile.backend
    container_name: visualportfolio-backend
    volumes:
      - ../../data:/app/data
    restart: unless-stopped
    networks:
      - sibuzu-net

networks:
  sibuzu-net:
    external: true

